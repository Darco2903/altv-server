<html>
    <head>
        <title>Guess Who - Hunter Aim Dot</title>

        <style>
            body {
                position: fixed;
                margin: -5px;
                top: 50%;
                left: 50%;
            }

            #aim-dot {
                --size: 8px;
                position: absolute;
                height: var(--size);
                width: var(--size);
                border-radius: 50%;
                border: 1px solid black;
                background-color: white;
                opacity: 0.8;
            }
        </style>
    </head>
    <body>
        <div id="hud">
            <span id="aim-dot"></span>
        </div>
    </body>
</html>
