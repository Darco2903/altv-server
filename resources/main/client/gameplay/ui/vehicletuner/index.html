                                <label class="mod-counter">0</label>

                            </div>
                        </div>

                        <div id="mod-n27">

                            <div class="right">

                            <div class="right">
                                <label class="mod-counter">0</label>
                                <input type="range" data-type="37" value="0" min="0" max="4" />
                            </div>
                        </div>

                        <div id="mod-n38">
                            <label class="mod-label">Hydraulics</label>
                            <div class="right">

                        <div id="mod-n39">

                    <div id="colors">
                        <div id="color-primary">
                            <label class="color-title">Principale</label>

                            <div class="color-type">
                                <label class="color-label">Type de peinture</label>
                                <select>
                                    <option value="0" selected>Normale</option>
                                    <option value="1">Metallique</option>
                                    <option value="2">Nacrée</option>
                                    <option value="3">Mate</option>
                                    <option value="4">Métale</option>
                                    <option value="5">Chrome</option>
                                    <option value="6">Caméléonne</option>
                                </select>
                            </div>

                            <div class="color-num">
                                <input type="range" data-type="0" value="0" min="0" max="74" />
                                <input type="range" data-type="1" value="0" min="0" max="74" />
                                <input type="range" data-type="2" value="0" min="0" max="73" />
                                <input type="range" data-type="3" value="0" min="0" max="19" />
                                <input type="range" data-type="4" value="0" min="0" max="4" />
                                <input type="range" data-type="5" value="0" min="0" max="0" />
                                <input type="range" data-type="6" value="0" min="0" max="9" />
                                <label class="color-name"></label>
                            </div>
                        </div>

                        <div id="color-secondary">
                            <label class="color-title">Secondaire</label>

                            <div class="color-type">
                                <label class="color-label">Type de peinture</label>
                                <select>
                                    <option value="0">Normale</option>
                                    <option value="1">Metallique</option>
                                    <option value="3">Mate</option>
                                    <option value="4">Métale</option>
                                    <option value="5">Chrome</option>
                                    <option value="6">Caméléonne</option>
                                </select>
                            </div>

                            <div class="color-num">
                                <input type="range" data-type="0" value="0" min="0" max="74" />
                                <input type="range" data-type="1" value="0" min="0" max="74" />
                                <input type="range" data-type="3" value="0" min="0" max="19" />
                                <input type="range" data-type="4" value="0" min="0" max="4" />
                                <input type="range" data-type="5" value="0" min="0" max="0" />
                                <input type="range" data-type="6" value="0" min="0" max="9" />
                                <label class="color-name"></label>
                            </div>
                        </div>

                        <div id="color-pearlescent">
                            <label class="color-title">Nacrage</label>
                            <div class="color-num">
                                <input type="range" value="0" min="0" max="160" />
                                <label class="color-name"></label>
                            </div>
                        </div>
                    </div>

                    <div id="wheels">
                        <div id="wheels-type">
                            <label class="wheel-label">Type de jantes</label>
                            <select>
                                <option value="-1" selected>Stock</option>
                                <option value="0">Sport</option>
                                <option value="1">Muscle</option>
                                <option value="2">Lowrider</option>
                                <option value="3">SUV</option>
                                <option value="4">Tout Terrain</option>
                                <option value="5">Tuner</option>
                                <option value="6">Moto</option>
                                <option value="7">Haut de Gamme</option>
                                <option value="8">Rue</option>
                                <option value="9">Rue Rouillées</option>
                                <option value="10">Circuit</option>
                                <option value="11">Tunning 1</option>
                                <option value="12">Tunning 2</option>
                            </select>
                        </div>

                        <div id="wheels-model">
                            <label class="wheel-label">Modèle des jantes</label>
                            <div class="wheel-num">
                                <input type="range" data-type="-1" min="-1" max="-1" value="-1" hidden />
                                <input type="range" data-type="0" min="0" max="49" value="0" />
                                <input type="range" data-type="1" min="0" max="35" value="0" />
                                <input type="range" data-type="2" min="0" max="29" value="0" />
                                <input type="range" data-type="3" min="0" max="37" value="0" />
                                <input type="range" data-type="4" min="0" max="34" value="0" />
                                <input type="range" data-type="5" min="0" max="47" value="0" />
                                <input type="range" data-type="6" min="0" max="47" value="0" />
                                <input type="range" data-type="7" min="0" max="39" value="0" />
                                <input type="range" data-type="8" min="0" max="30" value="0" />
                                <input type="range" data-type="9" min="0" max="30" value="0" />
                                <input type="range" data-type="10" min="0" max="19" value="0" />
                                <input type="range" data-type="11" min="0" max="29" value="0" />
                                <input type="range" data-type="12" min="0" max="29" value="0" />
                                <label class="wheel-counter">0</label>
                            </div>
                        </div>

                        <div id="wheels-color">
                            <label class="wheel-label">Couleur des jantes</label>
                            <div class="wheel-num">
                                <input type="range" min="0" max="160" value="0" />
                                <label class="color-name"></label>
                            </div>
                        </div>

                        <div id="wheels-tirecolor">
                            <label class="wheel-label">Couleur des pneus</label>
                            <select>
                                <option value="0" selected>Aucune</option>
                                <option value="1">Blanc Fin</option>
                                <option value="2">Blanc Moyen</option>
                                <option value="3">Blanc Large</option>
                                <option value="4">Rouge Fin</option>
                                <option value="5">Bleu Fin</option>
                                <option value="6">Atomic Blanc</option>
                            </select>
                        </div>

                        <div id="wheels-tirebrand">
                            <label class="wheel-label">Marque des pneus</label>
                            <select>
                                <option value="0" selected>Aucune</option>
                                <option value="1">Atomic Blanc</option>
                                <option value="2">Atomic Jaune</option>
                                <option value="3">Fukaru Blanc</option>
                                <option value="4">Fukaru Rouge</option>
                                <option value="5">Chepalle Jaune</option>
                                <option value="6">Chepalle Vert</option>
                            </select>
                        </div>

                        <div id="wheels-drift">
                            <label class="wheel-label">Drift</label>
                            <label class="checkbox bounce" id="labelCheckbox">
                                <input type="checkbox" id="checkbox" />
                                <svg viewBox="0 0 21 21">
                                    <polyline points="5 10.75 8.5 14.25 16 6"></polyline>
                                </svg>
                            </label>
                        </div>

                        <div id="wheels-track">
                            <label class="mod-label">Largeur de voie</label>

                            <div id="wheels-trackwidth-front">
                                <label class="mod-label">Avant</label>
                                <div class="right">
                                    <label class="mod-counter">0</label>
                                    <input type="range" data-ids="[0,1]" min="0.5" max="1.5" step="0.01" value="1" />
                                </div>
                            </div>

                            <div id="wheels-trackwidth-rear">
                                <label class="mod-label">Arrière</label>
                                <div class="right">
                                    <label class="mod-counter">0</label>
                                    <input type="range" data-ids="[2,3]" min="0.5" max="1.5" step="0.01" value="1" />
                                </div>
                            </div>
                        </div>

                        <div id="wheels-camber">
                            <label class="mod-label">Carrossage</label>

                            <div id="wheels-camber-front">
                                <label class="mod-label">Avant</label>
                                <div class="right">
                                    <label class="mod-counter">0</label>
                                    <input type="range" data-ids="[0,1]" min="-0.45" max="0.45" step="0.01" value="0" />
                                </div>
                            </div>

                            <div id="wheels-camber-rear">
                                <label class="mod-label">Arrière</label>
                                <div class="right">
                                    <label class="mod-counter">0</label>
                                    <input type="range" data-ids="[2,3]" min="-0.45" max="0.45" step="0.01" value="0" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="lights">
                        <div id="neons">
                            <div id="neons-select">
                                <div class="neon-select" id="neon-all">
                                    <label class="checkbox bounce" id="labelCheckbox">
                                        <input type="checkbox" />
                                        <svg viewBox="0 0 21 21">
                                            <polyline points="5 10.75 8.5 14.25 16 6"></polyline>
                                        </svg>
                                    </label>
                                </div>

                                <div class="neon-select" id="neon-front">
                                    <label class="checkbox bounce" id="labelCheckbox">
                                        <input type="checkbox" data-index="2" />
                                        <svg viewBox="0 0 21 21">
                                            <polyline points="5 10.75 8.5 14.25 16 6"></polyline>
                                        </svg>
                                    </label>
                                </div>

                                <div class="neon-select" id="neon-rear">
                                    <label class="checkbox bounce" id="labelCheckbox">
                                        <input type="checkbox" data-index="3" />
                                        <svg viewBox="0 0 21 21">
                                            <polyline points="5 10.75 8.5 14.25 16 6"></polyline>
                                        </svg>
                                    </label>
                                </div>

                                <div class="neon-select" id="neon-left">
                                    <label class="checkbox bounce" id="labelCheckbox">
                                        <input type="checkbox" data-index="0" />
                                        <svg viewBox="0 0 21 21">
                                            <polyline points="5 10.75 8.5 14.25 16 6"></polyline>

                                        <svg viewBox="0 0 21 21">

                                        </svg>
                                    </label>
                                </div>
                            </div>

                            <div id="neons-color">
                                <label class="mod-label">Couleur</label>
                                <input type="color" value="#ffffff" />
                            </div>
                        </div>

                        <div id="xenons">
                            <div id="xenons-state">
                                <label class="mod-label">Xenon</label>
                                <label class="checkbox bounce" id="labelCheckbox">
                                    <input type="checkbox" data-index="1" />
                                    <svg viewBox="0 0 21 21">
                                        <polyline points="5 10.75 8.5 14.25 16 6"></polyline>
                                    </svg>
                                </label>
                            </div>

                            <div id="xenons-color">
                                <label class="mod-label">Couleur des xenons</label>
                                <div class="neons-num">
                                    <input type="range" min="" max="12" value="0" />

                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="plate">
                        <div id="plate-type">
                            <label class="mod-label">Type de plaque</label>
                            <select>
                                <option value="0">Bleu / Blanc 1</option>
                                <option value="1">Jaune / Noir</option>
                                <option value="2">Jaune / Bleu</option>
                                <option value="3">Bleu / Blanc 2</option>
                                <option value="4">Bleu / Blanc 3</option>
                                <option value="5">Yankton</option>
                            </select>
                        </div>

                        <div id="plate-text">
                            <input type="text" value="ALTV" maxlength="8" pattern="[A-Za-z0-9]+" />
