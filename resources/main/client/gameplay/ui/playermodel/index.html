<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div id="pannel">
            <div id="options">
                <div class="form__group field" id="search">
                    <input type="input" class="form__field" id="search-input" placeholder="Search" required />
                    <label for="search" class="form__label">Recherche</label>
                </div>
            </div>

            <div id="pedClass">
                <button class="ped-category" id="Mod" selected>Mod</button>
                <button class="ped-category" id="Animal">Animal</button>
                <button class="ped-category" id="civmale">civmale</button>
                <button class="ped-category" id="CIVFEMALE">CIVFEMALE</button>
                <button class="ped-category" id="COP">Cop</button>
                <button class="ped-category" id="PLAYER">Main Characters</button>
                <button class="ped-category" id="army">Army</button>
                <button class="ped-category" id="LSD">LSMS | LSFD | LSPD</button>
            </div>

            <div id="content">
                <div id="Mod" selected></div>
                <div id="Animal"></div>
                <div id="civmale"></div>
                <div id="CIVFEMALE"></div>
                <div id="COP"></div>
                <div id="PLAYER"></div>
                <div id="army"></div>
                <div id="LSD"></div>

                <div id="searchList"></div>
            </div>
        </div>

        <div id="clones" hidden>
            <div class="ped-card">
                <img src="images/" loading="lazy" />
                <label></label>
            </div>
        </div>
    </body>

    <script src="app.js" type="module"></script>
</html>
