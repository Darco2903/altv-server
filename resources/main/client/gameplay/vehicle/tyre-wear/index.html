<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="./style.css" />
        <title>Tyre Wear</title>
    </head>

    <body>
        <div id="content">
            <div id="car">
                <div class="axle" id="front">
                    <span class="tyre left" data-index="0" selected></span>
                    <span class="tyre right" data-index="1" selected></span>
                </div>
                <div class="axle" id="mid">
                    <span class="tyre left" data-index="2"></span>
                    <span class="tyre right" data-index="3"></span>
                </div>
                <div class="axle" id="rear">
                    <span class="tyre left" data-index="4" selected></span>
                    <span class="tyre right" data-index="5"></span>
                </div>
            </div>
        </div>
    </body>

    <script src="./app.js"></script>
</html>
